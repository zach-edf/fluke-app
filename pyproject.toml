[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluke-community"
version = "0.1.0"
description = "Unofficial community desktop app, CLI, and SDK for BLE-enabled Fluke meters."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["fluke", "ble", "multimeter", "telemetry", "desktop"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "bleak>=0.22.3",
]

[project.optional-dependencies]
desktop = [
  "PySide6>=6.7",
  "matplotlib>=3.9",
]
dashboard = [
  "rich>=13.7",
]
data = [
  "pandas>=2.2",
  "pyarrow>=16",
]
full = [
  "PySide6>=6.7",
  "matplotlib>=3.9",
  "rich>=13.7",
  "pandas>=2.2",
  "pyarrow>=16",
]
dev = [
  "PySide6>=6.7",
  "matplotlib>=3.9",
  "rich>=13.7",
  "pandas>=2.2",
  "pyarrow>=16",
]

[project.scripts]
fluke = "apps.cli.main:main"
fluke-cli = "apps.cli.main:main"
fluke-desktop = "apps.desktop.main:main"

[tool.setuptools.packages.find]
where = [".", "packages"]
include = ["apps*", "fluke_*"]
