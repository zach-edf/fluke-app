name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  minimal:
    name: Minimal CLI/SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run minimal test suite
        run: |
          python -m unittest \
            tests.unit.test_cli_main \
            tests.unit.test_sdk_client \
            tests.unit.test_fluke_376fc_profile \
            tests.unit.test_fake_adapter_and_stream \
            tests.unit.test_logging_flow \
            tests.unit.test_workflow_catalog \
            tests.unit.test_workflow_runner \
            tests.unit.test_capture_export \
            tests.unit.test_debug_bundle \
            tests.unit.test_fixture_capture_tool \
            tests.unit.test_plugin_loader \
            tests.unit.test_statistics \
            tests.unit.test_store_paths

  full:
    name: Full Desktop Suite
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install full dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run full unit suite
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Run compile check
        shell: pwsh
        run: |
          python -m compileall apps packages tests
