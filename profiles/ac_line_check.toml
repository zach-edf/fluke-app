name = "ac_line_check"
description = "AC line observation profile with conservative alerting"

[record]
duration = 120
read_once = false
console = "changes"
dashboard = true
plot = true
plot_theme = "dark"
plot_window = 60
chars = [
  "b6982901-7562-11e2-b50d-00163e46f8fe",
  "b698290f-7562-11e2-b50d-00163e46f8fe",
]
out = "logs/ac_line_check.csv"
events_out = "logs/ac_line_check_events.csv"

[events]
contact_threshold = 1.0
over_voltage = 140.0
unstable_delta = 2.0
unstable_window = 2.0
unstable_min_points = 6

[sinks]
sqlite = "logs/fluke_sessions.db"
parquet = "logs/parquet/ac_line_check.parquet"

[annotations]
b = "Load connected"
o = "Load disconnected"
m = "Meter mode switched"
n = "Operator note"

[report]
dir = "reports"
formats = "html,pdf"
title = "AC Line Check Report"
